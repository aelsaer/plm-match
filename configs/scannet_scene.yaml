dataset_root: /path/to/scannet
out_dir: ./outputs/scannet_plm

dataset:
  type: scannet_rgbd
  scene: scene0000_00
  intrinsics_file: intrinsic_color.txt
  map:
    start_index: 0
    stride: 10
    max_frames: 40
  query:
    start_index: 150
    stride: 15
    max_frames: 20

backbone:
  name: dinov2
  model_name: dinov2_vits14
  input_size: [336, 336]
  device: cpu

anchors:
  alpha: 0.60
  beta: 0.40
  use_stability: false
  topk: 200
  grid_cells: [4, 4]
  nms_radius: 1

map:
  max_frames: 40

landmarks:
  merge_radius_m: 0.06
  merge_cos_sim: 0.70
  manifold_rank: 2
  min_obs: 2

matching:
  topk_landmarks: 10
  max_matches: 256
  use_pose_prior: true
  carry_pose_prior: true
  lambdas: [1.0, 1.2, 0.6, 0.3, 0.5]

pnp:
  reproj_error_px: 8.0
  iterations: 2000

online:
  integrate_query_depth: true

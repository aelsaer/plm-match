dataset_root: /path/to/dataset_root
out_dir: ./outputs/dinov2_generic

dataset:
  type: generic_rgbd
  intrinsics_file: intrinsics.txt
  map:
    name: map
    stride: 1
    max_frames: 20
  query:
    name: query
    stride: 1

backbone:
  name: dinov2
  model_name: dinov2_vits14
  input_size: [336, 336]
  device: cpu

anchors:
  alpha: 0.60
  beta: 0.40
  use_stability: false
  topk: 200
  grid_cells: [4, 4]
  nms_radius: 1

map:
  max_frames: 20

landmarks:
  merge_radius_m: 0.08
  merge_cos_sim: 0.72
  manifold_rank: 2
  min_obs: 3

matching:
  topk_landmarks: 10
  max_matches: 256
  use_pose_prior: true
  carry_pose_prior: true
  lambdas: [1.0, 1.2, 0.6, 0.2, 0.5]

pnp:
  reproj_error_px: 8.0
  iterations: 2000

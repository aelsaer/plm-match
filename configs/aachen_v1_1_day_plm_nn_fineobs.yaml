dataset_root: /home/phd/plm-match/datasets/aachen_v1_1

map:
  cache_path: ./outputs/aachen_day_refactor_sp_cache/landmarks.pkl
  map_feature_cache_size: 64
  map_gray_cache_size: 64
  compute_fine_descs: true

dataset:
  type: colmap_localization
  image_root: images_upright
  model_path: 3D-models/aachen_v_1_1
  db_image_prefixes: [db/]
  query_list: day_time_queries_with_intrinsics.txt

hloc:
  retrieval_file: pairs-query-netvlad50.txt
  topk_db_images: 50
  max_candidate_landmarks: 25000
  max_index_landmarks_per_image: 3000
  verify_image_batch_size: 5
  verify_image_schedule: [5, 10, 20, 50]
  grouping: covisibility
  covisibility_neighbors_per_seed: 5
  covisibility_expansion_seed_images: 20
  max_expanded_db_images: 100
  rank_candidate_landmarks: true
  candidate_support_weight: 1.0
  candidate_rank_weight: 0.25
  candidate_staticness_weight: 0.05

global_graph:
  enabled: false
  pooling: mean
  gem_p: 3.0
  cache_dir: null
  db_rerank_pool: 75
  rank_temperature: 10.0
  db_rank_weight: 0.7
  eupe_global_weight: 0.3
  covis_weight: 0.6
  covis_global_weight: 0.4
  candidate_graph_weight: 1.0
  landmark_graph_weight: 0.02

backbone:
  name: eupe
  repo_dir: /home/phd/maskmatch/EUPE
  weights_path: /home/phd/maskmatch/weights/EUPE-ViT-S.pt
  model_name: eupe_vits16
  input_size: [512, 512]
  device: cuda

anchors:
  source: superpoint_h5
  alpha: 0.60
  beta: 0.40
  use_stability: true
  topk: 2048
  harris_method: gftt
  keypoint_max_corners: 4096
  keypoint_quality_level: 0.005
  keypoint_min_distance_px: 8.0
  keypoint_nms_radius_px: 8.0
  keypoint_block_size: 3
  keypoint_weight: 1.0
  harris_weight: 2.0
  grid_cells: [16, 16]
  nms_radius: 1

landmarks:
  merge_radius_m: 0.08
  merge_cos_sim: 0.72
  manifold_rank: 0
  cache_manifold_rank: 0
  min_obs: 2
  max_obs_per_landmark: 8
  max_colmap_point_error: 4.0
  min_colmap_track_len: 3
  min_staticness: 0.05
  context_radius: 1
  harris_weight: 2.0
  graph:
    enabled: false
    topk_neighbors: 16
    max_landmarks_per_image: 128
    per_image_neighbors: 4
    max_edge_distance_m: 8.0

matching:
  topk_landmarks: 40
  retrieval_anchor_batch_size: 256
  materialize_topk_per_anchor: 2
  max_materialized_landmarks: 1024
  max_matches: 1024
  group_verify_patience: 2
  group_verify_min_inliers: 8
  group_verify_hard_inliers: 24
  use_pose_prior: false
  carry_pose_prior: false
  scorer: mean
  lambdas: [1.0, 1.2, 0.6, 0.2, 0.2]
  ppca_support_weight: 0.05
  min_cosine_sim: -1.0
  min_score: -1.0e9
  ratio_margin: 0.08
  min_match_guarantee: 0
  fine_primary: false
  fine_primary_topk: 40
  fine_primary_direct_score: false
  fine_primary_staticness_weight: 0.0
  fine_primary_graph_support_weight: 0.0
  local_memory:
    enabled: true
    descriptor: superpoint_h5
    direct_score: true
    mutual_nn: false
    topk_observations_per_anchor: 320
    landmarks_per_anchor: 2
    max_obs_per_landmark: 8
    fine_weight: 1.0
    eupe_prior_weight: 0.0
    mean_weight: 0.0
    support_weight: 0.0
    staticness_weight: 0.0
    graph_support_weight: 0.0
    observation_prior:
      enabled: false
      source: retrieval_rank
      weight: 0.03
      rank_tau: 10.0
      fallback_weight: 0.0
    graph_prior:
      enabled: false
      source: retrieval_rank
      rank_tau: 10.0
      diffusion_steps: 1
      diffusion_weight: 0.25
      score_weight: 0.005
      max_active_landmarks: 50000
      min_prior: 0.0
    vps:
      enabled: false
      num_words: 256
      top_words: 4
      target_correspondences: 0
      topk_observations_per_anchor: 128
      max_train_descriptors: 16384
      iterations: 4
      batch_size: 8192
      max_bucket_size: 4096
      skip_large_buckets: false
      min_similarity: -1.0
    observation_coherence:
      enabled: false
      candidates_per_anchor: 3
      group_by: observer_covisibility
      covis_neighbors: 5
      covis_max_seed_landmarks: 512
      max_seed_frames: 64
      min_unique_anchors: 12
      min_unique_landmarks: 12
      score_weight: 1.0
      anchor_weight: 0.05
      landmark_weight: 0.02
      staticness_weight: 0.02
      restrict_to_preferred_frames: true
      unique_landmark_per_anchor: true
      fallback_to_unconstrained: true
    ppca:
      enabled: false
      rank: 4
      min_obs: 4
      weight: 0.05
      parallel_weight: 0.25
      perp_weight: 1.0
      max_penalty: 8.0
  xfeat_primary: false
  xfeat_primary_topk: 40
  xfeat_rerank_coarse: false
  xfeat_rerank_weight: 0.5
  adaptive_min_cosine: false
  adaptive_cosine_margin: 0.25
  db_pose_radius_m: 60.0
  coherence_radius_m: null
  spatial_prior_enabled: true
  spatial_prior_topk_db: 10
  spatial_prior_radius_m: 50.0
  graph_filter:
    enabled: false
    mode: filter
    min_matches: 12
    min_component_size: 8
    min_degree: 1
    min_keep: 24
    keep_largest_component: true
    score_weight: 1.0
    soft_support_weight: 0.02
    soft_degree_weight: 0.0
    support_normalization: max
    soft_min_degree: 0
  multi_hypothesis_per_anchor: 1
  multi_hypothesis_unique_landmarks: true
  correspondence_graph:
    enabled: false
    mode: rerank
    candidates_per_anchor: 4
    max_nodes: 768
    min_nodes: 16
    min_keep: 24
    min_degree: 2
    min_2d_distance_px: 12.0
    max_3d_distance_m: 80.0
    plausible_min_depth_m: 1.0
    plausible_max_depth_m: 120.0
    spatial_sigma_m: 12.0
    covisibility_weight: 0.75
    spatial_weight: 0.35
    bearing_weight: 0.25
    score_weight: 1.0
    support_weight: 1.0
    degree_weight: 0.25
    support_normalization: sqrt_degree
    belief_iterations: 2
    belief_temperature: 1.0
    merge_fallback: true
    require_covisibility: false
  fine_rerank:
    enabled: false
    method: superpoint_h5
    db_features_path: outputs/table_i/superpoint_superglue/aachen/artifacts/feats-superpoint-n4096-rmax1600_db.h5
    query_features_path: outputs/table_i/superpoint_superglue/aachen/artifacts/feats-superpoint-n4096-rmax1600_queries.h5
    patch_size: 24
    xfeat_topk: 4096
    match_radius_px: 8.0
    topk: 40
    max_obs_per_landmark: 8
    store_observation_descs: true
    fine_mu_norm_chunk: 65536
    weight: 1.0
    support_weight: 0.05
    fuse_coarse: true
    coarse_weight: 0.15
    min_score: -1.0e9
    ratio_margin: 0.0
    require_descriptor: true
  pairwise_verifier:
    enabled: false
    topk_db_images: 5
    trigger_min_inliers: 20
    replace_below_inliers: 20
    accept_min_inliers: 12
    # Uses real HLoc SuperGlue matches when the query/db pair exists in this
    # file. Leave-one-out DB queries are not in the HLoc match file, so they
    # fall back to SuperPoint mutual-nearest matching unless fresh SuperGlue
    # pairs are generated for that split.
    matches_path: outputs/table_i/superpoint_superglue/aachen/artifacts/feats-superpoint-n4096-rmax1600_matches-superglue_pairs-query-netvlad50_active_queries.h5
    allow_mutual_fallback: true
    max_keypoints: 2048
    match_score_thresh: 0.2
    lift_radius_px: 4.0
    max_matches: 2048
    reproj_error_px: 8.0
    iterations: 8000
  early_geometry:
    enabled: false
    min_matches: 12
    min_inliers: 8
    reproj_error_px: 12.0
    iterations: 512

pnp:
  reproj_error_px: 4.0
  iterations: 8000
  multi_pass: true

dataset_root: /path/to/aachen_v1_1
out_dir: ./outputs/aachen_plm

dataset:
  type: colmap_localization
  image_root: images_upright
  model_path: outputs/hloc/sfm
  query_list: queries/night_time_queries_with_intrinsics.txt
  # Optional alternative:
  # query_image_dir: images_upright/query/night
  # query_gt_pose_dir: optional local GT pose directory for offline debugging
  default_query_camera_from_first_map: true
  db_image_prefixes: [db/]

backbone:
  name: dinov2
  model_name: dinov2_vits14
  input_size: [336, 336]
  device: cpu

anchors:
  alpha: 0.60
  beta: 0.40
  use_stability: false
  topk: 220
  grid_cells: [4, 4]
  nms_radius: 1

map:
  max_frames: 2000

landmarks:
  manifold_rank: 2
  min_obs: 2
  max_colmap_point_error: 4.0
  min_colmap_track_len: 2

matching:
  topk_landmarks: 20
  max_matches: 256
  use_pose_prior: false
  carry_pose_prior: true
  lambdas: [1.0, 1.2, 0.5, 0.3, 0.0]

pnp:
  reproj_error_px: 12.0
  iterations: 4000

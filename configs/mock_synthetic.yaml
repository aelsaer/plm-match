dataset_root: ./synthetic_demo
out_dir: ./outputs/mock_synthetic

dataset:
  type: generic_rgbd
  intrinsics_file: intrinsics.txt
  map:
    name: map
    stride: 1
    max_frames: 6
  query:
    name: query
    stride: 1

backbone:
  name: mock
  grid_size: [30, 40]
  dim: 128
  seed: 13

anchors:
  alpha: 0.65
  beta: 0.35
  use_stability: true
  topk: 240
  grid_cells: [4, 4]
  nms_radius: 1

map:
  max_frames: 6

landmarks:
  merge_radius_m: 0.05
  merge_cos_sim: 0.60
  manifold_rank: 2
  min_obs: 1

matching:
  topk_landmarks: 10
  max_matches: 256
  use_pose_prior: false
  carry_pose_prior: true
  lambdas: [1.0, 1.4, 0.6, 0.2, 0.0]

pnp:
  reproj_error_px: 6.0
  iterations: 2000

online:
  integrate_query_depth: true

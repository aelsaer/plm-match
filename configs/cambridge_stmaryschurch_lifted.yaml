dataset_root: /mnt/d/private/pairs/cambridge_landmarks/StMarysChurch

dataset:
  type: cambridge_landmarks
  scene: StMarysChurch
  image_root: .
  sfm_dir: /mnt/d/private/pairs/cambridge_landmarks/CambridgeLandmarks_Colmap_Retriangulated_1024px/StMarysChurch
  model_path: sfm_superpoint+superglue
  query_model_path: empty_all
  db_list: list_db.txt
  query_list: list_query.txt

reporting:
  benchmark: cambridge_landmarks

hloc:
  topk_db_images: 10

lifted_nn:
  topk: 10
  query_topk: 4096
  ratio_margin: 0.10
  min_similarity: 0.65
  support_weight: 0.03
  point_support_weight: 0.02
  rank_weight: 0.02
  attach_dist_weight: 0.0
  rank_tau: 10.0
  min_shared_points: 20
  max_cluster_images: 5
  max_cluster_seeds: 10
  max_matches: 4096
  pnp_first_thresh: 8.0
  pnp_refine_thresh: 4.0
  pnp_iterations: 8000
  min_final_inliers: 12
  min_pose_guided_inliers: 16
  pose_guided: false
  pose_guided_radius_px: 8.0
  pose_guided_score_thresh: 0.1
  pose_guided_reproj_penalty: 0.02
  metric_thresholds:
    - [0.25, 2.0]
    - [0.5, 5.0]
    - [5.0, 10.0]

dataset_root: ./synthetic_tum
out_dir: ./outputs/mock_tum_online

sequence_dataset:
  type: tum_rgbd_sequence
  rgb_file: rgb.txt
  depth_file: depth.txt
  groundtruth_file: groundtruth.txt
  preset: fr1
  stride: 1
  max_frames: 16
  max_assoc_delta: 0.05
  pose_assoc_delta: 0.05

backbone:
  name: mock
  grid_size: [30, 40]
  dim: 128
  seed: 13

anchors:
  alpha: 0.65
  beta: 0.35
  use_stability: true
  topk: 180
  grid_cells: [4, 4]
  nms_radius: 1

landmarks:
  merge_radius_m: 0.06
  merge_cos_sim: 0.60
  manifold_rank: 2
  min_obs: 1

matching:
  topk_landmarks: 10
  max_matches: 256
  use_pose_prior: true
  carry_pose_prior: true
  lambdas: [1.0, 1.4, 0.6, 0.2, 0.3]

pnp:
  reproj_error_px: 6.0
  iterations: 2000

online:
  use_gt_bootstrap: true
  bootstrap_count: 5
  max_age_frames: 20
  max_active_landmarks: 4000
  integrate_on_success: true
  integrate_pose_source: gt
  min_staticness: 0.0
